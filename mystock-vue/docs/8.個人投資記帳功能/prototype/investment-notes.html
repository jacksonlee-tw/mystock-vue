<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投資筆記 | MyStock Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7.0.0/primeicons.min.css">
  <link rel="stylesheet" href="investment-notes.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="返回 MyStock 記帳原型">
        <span class="brand-mark"><i class="pi pi-chart-line"></i></span>
        <span>MyStock <small>NOTEBOOK</small></span>
      </a>
      <nav class="side-nav" aria-label="投資記帳導覽">
        <a href="index.html"><i class="pi pi-arrow-left"></i><span>返回記帳總覽</span></a>
        <a class="active" href="investment-notes.html"><i class="pi pi-book"></i><span>投資筆記</span><b>12</b></a>
        <a href="#"><i class="pi pi-list"></i><span>交易紀錄</span></a>
        <a href="#"><i class="pi pi-eye"></i><span>觀察名單</span></a>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>Prototype · 僅供 UI/UX 討論</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>Portfolio</span><i class="pi pi-angle-right"></i><strong>Investment Notes</strong></div>
        <div class="top-actions">
          <button class="icon-button" id="themeButton" title="切換顯示模式" aria-label="切換顯示模式"><i class="pi pi-moon"></i></button>
          <button class="avatar" title="目前使用者" aria-label="目前使用者">JL</button>
        </div>
      </header>

      <section class="page-heading">
        <div>
          <p class="eyebrow">JOURNAL / 2026</p>
          <h1>投資筆記 <span id="noteCount" class="count-badge">12</span></h1>
          <p class="heading-copy">把當下的判斷留下來，讓未來的你看見決策是怎麼形成的。</p>
        </div>
        <button class="primary-button" id="newNoteButton"><i class="pi pi-plus"></i>新增筆記</button>
      </section>

      <section class="insight-strip" aria-label="筆記摘要">
        <div><span class="strip-label">本月筆記</span><strong id="monthCount">8</strong><small>篇</small></div>
        <div><span class="strip-label">最常記錄</span><strong id="topTag">研究</strong><small>標籤</small></div>
        <div><span class="strip-label">最近更新</span><strong id="lastUpdated">今天</strong><small>前</small></div>
        <div class="strip-quote"><i class="pi pi-sparkles"></i><span>記錄理由，比記錄結果更有價值。</span></div>
      </section>

      <section class="workspace">
        <div class="filters" aria-label="筆記篩選">
          <div class="search-box"><i class="pi pi-search"></i><input id="searchInput" type="search" placeholder="搜尋主旨或內容..." aria-label="搜尋主旨或內容"></div>
          <div class="filter-group">
            <label class="date-filter"><i class="pi pi-calendar"></i><input id="dateInput" type="month" aria-label="依月份篩選"></label>
            <select id="tagFilter" aria-label="依標籤篩選"><option value="">所有標籤</option></select>
            <button class="ghost-button" id="clearFilters"><i class="pi pi-filter-slash"></i><span>清除</span></button>
          </div>
        </div>

        <div class="content-grid">
          <div>
            <div class="section-bar"><span id="resultLabel">全部筆記</span><span id="resultCount" class="muted"></span><select id="sortSelect" aria-label="排序"><option value="newest">最新建立</option><option value="oldest">最早建立</option></select></div>
            <div id="noteList" class="note-list"></div>
            <div id="emptyState" class="empty-state" hidden><i class="pi pi-search"></i><h2>沒有找到筆記</h2><p>試試看調整搜尋條件，或寫下今天的第一筆觀察。</p></div>
            <div class="pagination" id="pagination"></div>
          </div>
          <aside class="side-panel">
            <div class="panel-heading"><span>標籤索引</span><i class="pi pi-tag"></i></div>
            <div id="tagCloud" class="tag-cloud"></div>
            <div class="panel-note"><i class="pi pi-info-circle"></i><p>列表只顯示內容摘要。點選筆記可在編輯器中查看完整內容。</p></div>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="noteModal" hidden>
    <section class="note-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header"><div><p class="eyebrow">NOTE EDITOR</p><h2 id="modalTitle">新增投資筆記</h2></div><button class="icon-button" id="closeModal" aria-label="關閉"><i class="pi pi-times"></i></button></div>
      <form id="noteForm">
        <input id="noteId" type="hidden">
        <div class="form-row"><label>日期<input id="noteDate" type="date" required></label><label>狀態<select id="noteStatus"><option value="published">已發布</option><option value="draft">草稿</option><option value="archived">已封存</option></select></label></div>
        <label>主旨<input id="noteSubject" type="text" maxlength="200" placeholder="這筆筆記想留下什麼？" required></label>
        <label>內容<textarea id="noteContent" rows="9" placeholder="記下你的觀察、判斷依據與下一步..." required></textarea></label>
        <div class="form-row"><label>標籤<span class="input-hint">以逗號分隔</span><input id="noteTags" type="text" placeholder="研究, 台積電, 長期"></label><label>關聯標的<span class="input-hint">選填</span><input id="noteSymbol" type="text" placeholder="TW · 2330"></label></div>
        <div class="modal-footer"><span id="sequenceHint" class="sequence-hint"><i class="pi pi-hashtag"></i> 儲存後自動取得當日流水號</span><div><button type="button" class="secondary-button" id="cancelButton">取消</button><button type="submit" class="primary-button"><i class="pi pi-check"></i>儲存筆記</button></div></div>
      </form>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><i class="pi pi-check-circle"></i><span></span></div>
  <script src="investment-notes.js"></script>
</body>
</html>
