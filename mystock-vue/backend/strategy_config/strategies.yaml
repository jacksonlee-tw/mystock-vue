# 均線策略設定檔（均線策略警示系統 設計文件第 7 節）。
# 修改這裡的參數不需要改程式碼即可生效（見設計文件 AC-7）；程式碼只負責解讀，不寫死任何均線天數或門檻。
#
# 原文件建議路徑是 config/strategies.yaml，但 backend 已有 config.py 模組，
# 兩者會撞名，因此改放在 strategy_config/ 底下（見策略管理架構實作計畫的說明）。

defaults:
  ma_periods: [5, 10, 20, 60, 120, 240]
  volume_ma_period: 5 # 均量計算天數
  lookback_days: 1 # 排程掃描時，每次檢查最近幾天（手動 /alerts/scan 可覆寫，方便回填測試）
  scan_frequency: "daily_close" # daily_close | intraday_15m（未來）
  # ── KD（KD指標 設計規格書 §4.3）──────────────
  kd_params:
    - [9, 3, 3] # [fastk_period, slowk_period, slowd_period]
  kd_warmup_bars: 25 # 遞迴平滑暖身根數，見設計規格書 §3.3 誤差推導
  kd_smoothing: "wilder_1_3" # 台股慣例，決議 D1：台股／美股一體適用，見設計規格書 §12
  # ── MACD／RSI／布林通道／ATR／近N日高低（Phase1-基礎量化與技術面 設計文件 §5）──
  macd_params: [12, 26, 9] # [fast_period, slow_period, signal_period]
  rsi_periods: [6, 14]
  bollinger_params: [20, 2.0] # [period, num_std]
  atr_period: 14
  levels_windows: [20, 60] # 近 N 日高低（支撐／壓力）視窗

strategies:
  # ── 突破 / 跌破策略 ──────────────────────────
  - id: "price_cross_ma"
    name: "收盤價突破/跌破關鍵均線"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    conditions:
      - type: "price_cross"
        target: "close"
        ma_periods: [20, 60, 240] # 僅監控月/季/年線
        directions: ["cross_above", "cross_under"]
    filters:
      - type: "volume_confirm"
        params: { multiple: 1.5 }
      - type: "candlestick_confirm"
        params: { body_ratio: 0.5 }

  - id: "ma_golden_death_cross"
    name: "均線黃金/死亡交叉"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    conditions:
      - type: "ma_cross"
        pairs:
          - { short: 5, long: 20 }
          - { short: 20, long: 60 }
          - { short: 60, long: 240 }

  # ── 排列策略 ──────────────────────────────────
  - id: "ma_alignment"
    name: "均線多頭/空頭排列"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    conditions:
      - type: "alignment"
        ma_periods: [5, 10, 20, 60]
        require_slope: true # 需同時判斷斜率方向

  # ── 擠壓突破 ──────────────────────────────────
  - id: "ma_squeeze_breakout"
    name: "均線糾結突破"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    conditions:
      - type: "squeeze_breakout"
        ma_periods: [5, 10, 20, 60]
        squeeze_threshold: 0.02 # 極差 < 股價 × 2%
        squeeze_min_days: 5
    filters:
      - type: "volume_confirm"
        params: { multiple: 1.5 }

  # ── 乖離率 ──────────────────────────────────
  - id: "extreme_bias"
    name: "乖離率過大警示"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    conditions:
      - type: "bias"
        ma_period: 60
        overbought_threshold: 25 # 正乖離 ≥ 25% → 超買
        oversold_threshold: -15 # 負乖離 ≤ −15% → 超賣

  # ── 回踩測試 ──────────────────────────────────
  - id: "ma_pullback_support"
    name: "均線回踩支撐"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    conditions:
      - type: "pullback"
        ma_periods: [20, 60]
        proximity_percent: 1.0 # 距離均線 ±1%
        trend_lookback_days: 20 # 過去 N 天須在均線之上

  # ══ 籌碼型態警示（籌碼選股策略 設計文件第 5.5 節）══════════════
  # 只沿用現有追蹤清單（get_target_stocks），對應文件的 all_tracked 選股池；
  # 大型權值波段/投信中小型作帳兩個核心策略需要市值分層選股池（文件第 4 節
  # universe），尚未建立，暫不啟用。僅台股適用（美股無三大法人/信用交易資料）。
  - id: "chip_bottom_turnover"
    name: "底部換手（洗盤）"
    category: "chip"
    enabled: true
    markets: ["tw"]
    conditions:
      - type: "chip_bottom_turnover"
        ma_period: 20
        lookback_below_days: 20 # C1：近 N 日內須曾跌破均線
        margin_change_window: 20 # C2：融資增減率視窗
        margin_change_max_pct: -5 # C2：融資須退場 ≥5%
        institutional_window: 5 # C3：三大法人近 N 日累計買超
        consec_buy_days: 3 # C3：外資或投信連續買超天數

  - id: "chip_short_squeeze"
    name: "高檔軋空（暴走）"
    category: "chip"
    enabled: true
    markets: ["tw"]
    conditions:
      - type: "chip_short_squeeze"
        ma_period: 20
        ma_slope_window: 5 # C1：均線斜率觀察窗
        institutional_window: 5 # C2：三大法人近 N 日累計買超
        institutional_min_buy_days: 3 # C2：法人買超天數門檻
        # C3 簡化：無市值分層資料前先用單一預設門檻（文件中型股門檻 5%），
        # 待 universe 模組完成後改依 mcap_rank 分層覆寫（文件第 5.5 節）
        short_margin_ratio_min_pct: 5
        short_margin_ratio_percentile_window: 60
        short_margin_ratio_percentile: 90
        short_change_window: 5 # C4：融券增幅視窗
        short_change_min_pct: 30 # C4：融券須激增 ≥30%

  - id: "chip_distribution_top"
    name: "高檔出貨（崩盤前）"
    category: "chip"
    enabled: true
    markets: ["tw"]
    conditions:
      - type: "chip_distribution_top"
        ma_period: 20
        consec_sell_days: 3 # C2：法人連續賣超天數
        margin_high_window: 60 # C3：融資餘額創新高視窗

  # ══ KD 隨機指標策略（KD指標 設計規格書 §5）══════════════
  # 純 OHLC 指標，台股／美股皆適用。門檻與守衛全部在此調整，改完存檔即生效（不需重啟）。
  - id: "kd_oversold_golden_cross"
    name: "KD 超賣區黃金交叉"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 10 # 覆寫全域 ALERT_COOLDOWN_DAYS（設計規格書 §5.7）
    conditions:
      - type: "kd_cross"
        kd_params: [9, 3, 3]
        oversold_threshold: 20
        overbought_threshold: 80
        zone_rule: "both"
        directions: ["golden_cross_oversold"]
        trend_guard:
          ma_period: 60
          mode: "require_above" # 只在季線之上做超賣反彈，避開下跌段接刀
        blunt_guard:
          window: 5
          mode: "downgrade" # 決議 D2：先標記不擋，見設計規格書 §9 P1.5 上線後檢核
    filters:
      - type: "volume_confirm"
        params: { multiple: 1.2 }
      - type: "candlestick_confirm"
        params: { body_ratio: 0.4 }
      - type: "institutional_buy" # 僅台股會通過（美股恆 false，只影響強度）
        params: { lookback_days: 3 }

  - id: "kd_overbought_death_cross"
    name: "KD 超買區死亡交叉"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 10
    conditions:
      - type: "kd_cross"
        kd_params: [9, 3, 3]
        oversold_threshold: 20
        overbought_threshold: 80
        zone_rule: "both"
        directions: ["death_cross_overbought"]
        trend_guard:
          mode: "off" # 出場訊號不設趨勢門檻，寧可多提醒
        blunt_guard:
          window: 5
          mode: "downgrade"

  # ══ MACD 指標策略（Phase1-基礎量化與技術面 設計文件 §9 Q-1）══════════════
  # 純 OHLC 指標，台股／美股皆適用，比照 KD 策略拆成黃金/死亡交叉各一個策略，方便各自設定
  # cooldown 與濾網。DIF/訊號線參數沿用 defaults.macd_params，改這裡不影響圖表顯示。
  - id: "macd_golden_cross"
    name: "MACD 黃金交叉"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 10
    conditions:
      - type: "macd_cross"
        macd_params: [12, 26, 9]
        directions: ["golden_cross"]
    filters:
      - type: "volume_confirm"
        params: { multiple: 1.2 }

  - id: "macd_death_cross"
    name: "MACD 死亡交叉"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 10
    conditions:
      - type: "macd_cross"
        macd_params: [12, 26, 9]
        directions: ["death_cross"]

  # ══ RSI 指標策略（Phase1-基礎量化與技術面 設計文件 §9 Q-1／Q-3）══════════════
  # 門檻採業界慣用 70/30（Q-3 決議，取代 v1.0 草案的 80/20）；僅在跨越門檻的當天觸發，
  # 不對區間內每天都發警示（比照 kd_cross 的既有設計）。
  - id: "rsi_oversold_recovery"
    name: "RSI 超賣區止跌"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 10
    conditions:
      - type: "rsi_zone"
        rsi_period: 14
        oversold_threshold: 30
        overbought_threshold: 70
        directions: ["oversold_recovery"]

  - id: "rsi_overbought_reversal"
    name: "RSI 超買區轉弱"
    category: "technical"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 10
    conditions:
      - type: "rsi_zone"
        rsi_period: 14
        oversold_threshold: 30
        overbought_threshold: 70
        directions: ["overbought_reversal"]

  # ══ 基本面出場警示（賣股策略 設計文件第四節 §1「成長動能衰竭」）══════════════
  - id: "fundamental_revenue_decline"
    name: "營收連續衰退出場"
    category: "fundamental"
    enabled: true
    markets: ["tw"]
    conditions:
      - type: "revenue_yoy_decline"
        consecutive_months: 2 # 連續衰退月數門檻
        yoy_threshold: 0 # yoy_percent 須低於此值（%）才算衰退

  # ══ 全市場選股策略（選股功能與爬蟲 規格書 §5、§13）═════════════════════════
  - id: "pick_valuation_low_pe"
    name: "低本益比高殖利率精選"
    category: "stock_picking"
    scope: "universe"
    universe_tier: "top500"
    max_picks_per_day: 10
    sort_by: "pe_ratio"
    enabled: true
    markets: ["tw"]
    cooldown_days: 10
    conditions:
      - type: "valuation_filter"
        pe_max: 15.0
        pe_min: 0.1
        dividend_yield_min: 4.0

  - id: "pick_revenue_growth_momentum"
    name: "營收高成長動能精選"
    category: "stock_picking"
    scope: "universe"
    universe_tier: "all_tracked"
    max_picks_per_day: 10
    sort_by: "revenue_yoy"
    enabled: true
    markets: ["tw"]
    cooldown_days: 10
    conditions:
      - type: "revenue_growth"
        yoy_min: 20.0
        consecutive_months: 2

  - id: "pick_chip_institutional_resonance"
    name: "法人籌碼共振精選"
    category: "stock_picking"
    scope: "universe"
    universe_tier: "all_tracked"
    max_picks_per_day: 10
    sort_by: "chip_ratio"
    enabled: true
    markets: ["tw"]
    cooldown_days: 10
    conditions:
      - type: "chip_resonance"
        foreign_consec_days: 2
        trust_consec_days: 2
        foreign_net_ratio_min: 5.0

  - id: "pick_multi_factor_resonance"
    name: "多因子共振旗艦精選"
    category: "stock_picking"
    scope: "universe"
    universe_tier: "top500"
    max_picks_per_day: 5
    sort_by: "revenue_yoy"
    enabled: true
    markets: ["tw"]
    cooldown_days: 10
    conditions:
      - type: "stock_pick_resonance"
        pe_max: 20.0
        dividend_yield_min: 3.0
        revenue_yoy_min: 15.0

  # ══ 相對低點承接（股價相對低點 需求規格書 §4、§7；P0）══════════════════════
  # 低估值 + 營收未衰退 + 季線極端負乖離 + KD 超賣 + 融資洗盤法人低接 + 帶量站回月線，
  # 六項條件全部 AND 成立才入選（不猜最低點、不接價值陷阱）。全部門檻可調、不需重啟服務。
  - id: "pick_relative_low_zone"
    name: "相對低點承接精選"
    category: "stock_picking"
    scope: "universe"
    universe_tier: "top500"
    max_picks_per_day: 10
    sort_by: "dividend_yield"
    enabled: true
    markets: ["tw"]
    cooldown_days: 20 # 底部條件會連續多日成立，冷卻拉長避免同一段底部天天上榜
    conditions:
      - type: "relative_low_zone"
        # C1 估值
        pe_max: 15.0
        pe_min: 0.1
        pb_max: 1.5
        dividend_yield_min: 4.0 # 單位為百分比數值，不是 0.04
        # C2 基本面守衛
        revenue_yoy_min: 0.0
        revenue_consecutive_months: 2
        # C3 超跌狀態
        bias_ma_period: 60
        bias_max: -15.0
        bias_lookback_days: 10
        # C4 動能超賣
        kd_params: [9, 3, 3]
        kd_oversold: 20
        kd_lookback_days: 10
        # C5 籌碼洗盤
        margin_change_window: 10
        margin_change_max_pct: -5.0
        institutional_window: 5
        institutional_min_buy_days: 3
        # C6 右側確認（必要條件，不得改放 filters）
        above_ma_period: 20
        volume_multiple: 1.5
    filters:
      - type: "institutional_buy" # 只影響 signal_strength，不擋訊號
        params: { lookback_days: 3 }

  # ══ 持倉出場風控策略（選股功能與爬蟲 規格書 §6、§13）═══════════════════════
  - id: "exit_trailing_stop"
    name: "移動停利出場風控"
    category: "risk"
    scope: "watchlist"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 5
    conditions:
      - type: "trailing_stop"
        drawdown_pct: 10.0

  - id: "exit_fixed_stop_loss"
    name: "固定停損出場風控"
    category: "risk"
    scope: "watchlist"
    enabled: true
    markets: ["tw", "us"]
    cooldown_days: 5
    conditions:
      - type: "fixed_stop_loss"
        stop_loss_pct: 8.0

# ── 僅台股可用的濾網 ──────────────────────────
filters_registry:
  - id: "institutional_buy"
    name: "法人買超濾網"
    markets: ["tw"]
    params:
      lookback_days: 3
      require: "foreign_or_trust_net_buy"
