# 產業鏈骨架設定（docs/16.AI技術分析/Phase3-產業鏈知識圖譜與輪動模型.md §6.1）
# 只定義「鏈的骨架與參數」，實際成分股上下游關聯存於資料庫 industry_chain_edges（§5.2）；
# 設定檔由人工審閱、變動頻率低，邊的資料隨爬取/萃取結果更新、變動頻率高，兩者分離。
#
# 目錄命名比照 strategy_config/，避開與 backend/config.py 撞名（見該檔案頭既有註解），
# 路徑不採原始構想的 config/industry_chains.yaml（FR-2）。
#
# ⚠️ 本檔可透過「產業鏈知識圖譜」頁面的「管理產業鏈」對話框編輯，儲存時會整份覆寫
#    （含本注釋區塊）——手動加的額外註解會在下次存檔時消失；長篇備註請改填每條鏈的
#    note 欄位（會被保留、也會顯示在維護對話框裡）。

defaults:
  lead_lag_window_days: [1, 30]
  decouple_threshold: 0.1
  decouple_check_window_days: 60
chains:
  - chain_id: ai_server
    name: AI 伺服器鏈
    downstream_leaders: ['2382', '3231', '6669']
    lead_lag_window_days: [1, 15]
    extraction_hint: 請特別涵蓋散熱、電源、機殼與高速連接器環節。
  - chain_id: semiconductor
    name: 半導體鏈
    downstream_leaders: ['2330']
  - chain_id: ccl_pcb
    name: 銅箔基板／PCB 鏈
    downstream_leaders: ['1815', '1802', '5340', '8358', '4989', '1303', '1717', '2383',
      '6274', '6213', '3037', '8046', '3189', '2368', '3044', '8155', '2313', '2367',
      '4958', '6269', '3715']
  - chain_id: cpo_photonics
    name: CPO 矽光子產業鏈
    downstream_leaders: ['2345', '2382', '2317', '6669']
    extraction_hint: 聚焦 CPO（共同封裝光學）與矽光子在 AI 伺服器與資料中心網通交換器的應用：上游為矽光子磊晶材料、CoWoS／CPO
      封裝設備與高階雷射晶片；中游為先進晶圓代工、CPO 封裝整合、光纖陣列與微透鏡對位、光被動元件跳線、高階光收發模組；下游終端為 800G/1.6T 交換器與
      AI 伺服器機櫃整合商，最終客戶為北美雲端 CSP（Google／AWS／微軟／Meta）。
    note: 使用者於 2026-08-30 提供之上下游整理；邊資料已以 source=manual 人工建立並標記已核可
