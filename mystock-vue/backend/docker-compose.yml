# 於 backend/ 目錄下執行 `docker compose up -d`（會自動讀取同目錄的 .env，見設計文件第 2.2 節）。
services:
  db:
    image: postgres:15
    container_name: mystock_db
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10
    container_name: mystock_flyway
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migration:/flyway/sql
    command: >
      -url=jdbc:postgresql://db:5432/${POSTGRES_DB}
      -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} migrate

  backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: mystock_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups

  # 爬蟲開發.md 第七節「Docker 執行與排程」：API 服務與排程器同一個容器
  # （排程器內嵌在 FastAPI lifespan 裡，見 services/scheduler.py），不用另開 crawler_worker。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystock_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Taipei
      # 容器間走 docker-compose 內部網路，固定連到 db 服務名稱，跟本機開發用的
      # POSTGRES_HOST=localhost（.env）不同，這裡明確覆寫。
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATA_SOURCE: ${DATA_SOURCE:-json}
      STOCK_CODES: ${STOCK_CODES:-}
      US_STOCK_CODES: ${US_STOCK_CODES:-}
      MONTHS_RANGE: ${MONTHS_RANGE:-3}
      QUARTERS_RANGE: ${QUARTERS_RANGE:-4}
      ENABLED_MARKETS: ${ENABLED_MARKETS:-tw,us}
      BACKFILL_MAX_DAYS: ${BACKFILL_MAX_DAYS:-90}
    ports:
      - "8000:8000"
    volumes:
      # 爬蟲落地的 JSON（data/tw、data/us、_alerts）跨容器重啟保留。
      - ./data:/app/data
      # 透過 UI 觸發 save_target_stocks() 寫回的追蹤股票清單也要保留，掛回同一份 .env。
      # 注意：bind mount 單一檔案時，若宿主機端 .env 不存在，Docker 會自動建立成「目錄」
      # 而非檔案，導致容器內讀寫失敗；啟動前務必確認 backend/.env 已存在（複製 .env.example）。
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
